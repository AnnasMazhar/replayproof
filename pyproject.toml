[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replayproof"
version = "0.1.0"
description = "Deterministic, offline-replayable regression testing for LLM agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
]

[project.scripts]
agenteval = "agenteval.cli:main"

[project.urls]
Homepage = "https://github.com/AnnasMazhar/replayproof"
Repository = "https://github.com/AnnasMazhar/replayproof"
"Bug Tracker" = "https://github.com/AnnasMazhar/replayproof/issues"
Changelog = "https://github.com/AnnasMazhar/replayproof/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.2",
    "mutmut==3.3.0",
    "ruff==0.6.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["mutants/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
