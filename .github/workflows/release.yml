name: Release to PyPI

# Triggers on a pushed semver tag (e.g. v0.1.0, v1.2.3).
# Uses PyPI trusted publishing — no API token stored in secrets.
# To publish: push a tag matching v* after the repo is configured on PyPI:
#   git tag v0.1.0 && git push origin v0.1.0
# PyPI trusted-publishing setup (one-time):
#   1. Create the project on PyPI: https://pypi.org/manage/account/publishing/
#   2. Add a "pending" publisher: owner=AnnasMazhar, repo=agent-eval-harness,
#      workflow=release.yml, environment=pypi.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing

jobs:
  # A tag that does not match the package version silently produces a release whose artifact is
  # named for a different version. Fail before building.
  version-check:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the tag matches the package version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=v$tag package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag does not match package version $pkg — bump pyproject.toml before tagging"; exit 1; }

  build:
    name: Build distribution
    needs: version-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv==0.4.29

      - name: Build wheel and sdist
        run: |
          uv pip install build==1.2.2
          python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Smoke-test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv==0.4.29

      - name: Install and test
        run: |
          uv venv
          uv pip install -e '.[dev]'
          .venv/bin/python -m pytest -q

  # Publishing to PyPI is OPT-IN. It stays skipped until a trusted publisher exists for this repo on
  # PyPI (PyPI → project → Publishing → add publisher: repository=AnnasMazhar/replayproof,
  # workflow=release.yml, environment=pypi). Until that exists the job fails with
  # `invalid-publisher`, which turns every tag red for a pure configuration reason.
  # Enable it by setting the repository variable PYPI_PUBLISH=true (Settings → Secrets and
  # variables → Actions → Variables).
  publish:
    name: Publish to PyPI
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: pypi

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password or token needed — OIDC trusted publishing handles auth.
